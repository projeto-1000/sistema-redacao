project_id = "projeto-1000"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "http://127.0.0.1:3001"
additional_redirect_urls = [
  "http://127.0.0.1:3000/**",
  "http://127.0.0.1:3001/**",
  "http://127.0.0.1:3002/**",
]

[storage]
enabled = true