name: Cancellation Expiry SQL Test (isolated)

on:
  push:
    branches:
      - feat/subscription-cancellation-policy
    paths:
      - ".github/workflows/cancellation-expiry-sql-test.yml"
      - "supabase/migrations/**"
      - "supabase/tests/completed-cancellation-history.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  expiry-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      - name: Start isolated local Supabase and apply migrations
        run: |
          # The initial schema uses transaction_timeout, available in PostgreSQL 17.
          # Override only this runner's local config; do not change remote settings.
          sed -i 's/^major_version = 15$/major_version = 17/' supabase/config.toml
          supabase start

      - name: Test refund history and courtesy expiry
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            --no-psqlrc --set=ON_ERROR_STOP=1 --pset=pager=off \
            --file=supabase/tests/completed-cancellation-history.sql
